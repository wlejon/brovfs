name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# brovfs deletes, overwrites and renames files on a user's behalf, walking
# trees through handles and identity checks so that a path swapped for a link
# mid-operation cannot redirect it. Time-of-check/time-of-use races, path
# injection and unchecked buffer arithmetic in the directory-entry and
# .DS_Store parsers are the realistic bugs, and they are what the C++ queries
# look for. The Linux backends are what this analyses.
#
# brovfs has no vendored or sibling code, so there is nothing to pre-build
# outside the trace: every translation unit compiled below is ours.
jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v7
        with:
          path: brovfs

      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Configure
        run: cmake -S brovfs -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          source-root: brovfs
          queries: security-extended

      - name: Build brovfs (traced)
        run: cmake --build build --parallel 4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
